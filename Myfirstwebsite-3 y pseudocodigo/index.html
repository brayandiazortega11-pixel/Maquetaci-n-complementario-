<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquetación 3 - Pseudo-clases de Formulario, Validación y Lógicas Modernas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container-fluid py-3">

        <div class="row g-2 mb-2">
            <section class="col-6 col-sm-6 col-md-3 col-lg-3 col-xl-9 col-xxl-9 altura p-3">
                <div class="h-100 d-flex flex-column justify-content-center">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="badge-code"></span>
                        <small class="fw-bold text-dark"></small>
                    </div>
                    <div class="d-flex flex-wrap gap-2 align-items-center">
                        <input type="email" class="form-control form-control-sm input-valida flex-grow-1" placeholder="nombre@correo.com (Campo Obligatorio)" required>
                        <span class="status-indicator"></span>
                    </div>
                </div>
            </section>
            <aside class="col-6 col-sm-6 col-md-9 col-lg-9 col-xl-3 col-xxl-3 altura p-3 text-white">
                <div class="h-100 d-flex flex-column justify-content-center">
                    <span class="badge-code-aside mb-1"></span>
                    <label class="form-label small m-0 mb-1"></label>
                    <input type="text" class="form-control form-control-sm input-opcional" placeholder="Teléfono (Opcional)">
                </div>
            </aside>
        </div>

       
        <div class="row g-2 mb-2">
            <section class="col-6 col-sm-6 col-md-4 col-lg-4 col-xl-3 col-xxl-3 altura p-3">
                <div class="h-100 d-flex flex-column justify-content-center">
                    <span class="badge-code mb-1"></span>
                    <label class="small fw-bold mb-1"></label>
                    <input type="number" min="1" max="10" value="5" class="form-control form-control-sm input-rango">
                    <small class="rango-msg mt-1 fw-bold"></small>
                </div>
            </section>
            <aside class="col-6 col-sm-6 col-md-8 col-lg-8 col-xl-9 col-xxl-9 altura p-3 text-white">
                <div class="h-100 d-flex flex-column justify-content-center">
                    <span class="badge-code-aside mb-1"></span>
                    <p class="small m-0 mb-1">:</p>
                    <input type="text" class="form-control form-control-sm input-placeholder" placeholder="Escribe algo aquí para activar la regla de ausencia de placeholder...">
                </div>
            </aside>
        </div>


        <div class="row g-2 mb-2">
            <section class="col-6 col-sm-6 col-md-6 col-lg-6 col-xl-9 col-xxl-9 altura p-3">
                <div class="h-100 d-flex flex-column justify-content-center">
                    <span class="badge-code mb-1"></span>
                    <form class="d-flex flex-wrap gap-2 align-items-center" onsubmit="return false;">
                        <button type="submit" class="btn btn-sm btn-action"></button>
                        <button type="button" class="btn btn-sm btn-action" disabled></button>
                        <button type="button" class="btn btn-sm btn-action"></button>
                    </form>
                </div>
            </section>
            <aside class="col-6 col-sm-6 col-md-6 col-lg-6 col-xl-3 col-xxl-3 altura p-3 text-white">
                <div class="h-100 d-flex flex-column justify-content-center">
                    <span class="badge-code-aside mb-1"></span>
                    <input type="text" value="Texto Protegido" readonly class="form-control form-control-sm campo-readonly mb-1">
                </div>
            </aside>
        </div>

        <div class="row g-2 mb-2">
            <section class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-3 col-xxl-3 order-2 order-md-1 altura p-3">
                <div class="h-100 d-flex flex-column justify-content-center">
                    <span class="badge-code mb-1"></span>
                    <h6 class="m-0 fw-bold"></h6>
                    <p class="small m-0"><code></code>  <code></code>.</p>
                </div>
            </section>
            <aside class="col-12 col-sm-12 col-md-8 col-lg-8 col-xl-9 col-xxl-9 order-1 order-md-2 altura p-3 text-white tarjeta-has">
                <div class="h-100 d-flex flex-column justify-content-center">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="badge-code-aside"></span>
                        <span class="tag-has-estado"></span>
                    </div>
                    <p class="small m-0 my-1"><code></code></p>
                    <label class="form-check-label d-flex align-items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="form-check-input check-potente m-0">
                        <strong class="text-warning"></strong>
                    </label>
                </div>
            </aside>
        </div>

        <div class="row g-2">
            <section class="col-6 col-sm-6 col-md-3 col-lg-3 col-xl-6 col-xxl-6 altura p-3">
                <div class="h-100 d-flex flex-column justify-content-center">
                    <span class="badge-code mb-1"></span>
                    <h6 class="m-0 fw-bold"></h6>
                    <p class="small m-0"><code></code> </p>
                </div>
            </section>
            <aside class="col-6 col-sm-6 col-md-9 col-lg-9 col-xl-6 col-xxl-6 altura p-3 text-white">
                <div class="h-100 d-flex flex-column justify-content-center">
                    <span class="badge-code-aside mb-1"></span>
                    <h6 class="m-0 text-white"></h6>
                    <p class="small m-0 opacity-75"></p>
                </div>
            </aside>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
